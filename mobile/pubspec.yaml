name: openflight_mobile
description: OpenFlight companion app — professional golf launch monitor dashboard and 3D simulator.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # gRPC & Protobuf
  grpc: ^4.0.0
  protobuf: ^3.1.0

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Unity widget (3D simulator)
  flutter_unity_widget: ^2022.2.1

  # UI utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Misc
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
